name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify distributed license notices
        run: |
          cmp LICENSE dist/licenses/project.txt
          cmp node_modules/@jitl/quickjs-wasmfile-release-sync/LICENSE dist/licenses/quickjs.txt
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const notices = readFileSync('dist/licenses/dependencies.md', 'utf8')
          for (const name of ['@fontsource-variable/geist ', '@fontsource-variable/geist-mono ', 'lucide-react ', 'react ', 'react-dom ', 'scheduler ']) {
            if (!notices.includes(`## ${name}`)) throw new Error(`Missing license: ${name}`)
          }
          if (!notices.includes('Cole Bemis')) throw new Error('Missing Feather attribution')
          NODE
      - run: git diff --check
